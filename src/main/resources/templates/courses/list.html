<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(
          pageTitle='My Courses',
          activePage='courses',
          content=~{::content}
      )}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-book text-primary me-2"></i>My Courses</h4>
    <a th:href="@{/courses/add}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Add Course
    </a>
</div>

<!-- My Enrolled Courses -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-header py-2 px-3 border-bottom">
        <strong>Enrolled Courses</strong>
        <span class="badge bg-primary ms-2" th:text="${myCourses.size()}">0</span>
    </div>
    <div class="card-body p-0">
        <div th:if="${myCourses.isEmpty()}" class="text-center py-5 text-muted">
            <i class="bi bi-book fs-1 opacity-25"></i>
            <p class="mt-3">You haven't added any courses yet.</p>
            <a th:href="@{/courses/add}" class="btn btn-primary btn-sm">Add Your First Course</a>
        </div>
        <div th:if="${!myCourses.isEmpty()}" class="row g-3 p-3">
            <div th:each="sc : ${myCourses}" class="col-md-6 col-xl-4">
                <div class="card h-100 border shadow-sm course-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="bg-primary bg-opacity-10 text-primary rounded px-2 py-1 small fw-semibold"
                                 th:text="${sc.course.courseCode}">CODE</div>
                            <span class="badge bg-success" th:text="${sc.enrollmentStatus.name()}">ENROLLED</span>
                        </div>
                        <h6 class="fw-bold mt-2" th:text="${sc.course.courseName}">Course Name</h6>
                        <p class="text-muted small mb-2" th:if="${sc.course.instructor}">
                            <i class="bi bi-person-fill me-1"></i><span th:text="${sc.course.instructor}">Prof.</span>
                        </p>
                        <div class="small text-muted" th:if="${sc.course.duration}">
                            <i class="bi bi-clock me-1"></i><span th:text="${sc.course.duration}">Duration</span>
                        </div>
                        <div class="small text-muted" th:if="${sc.course.semester}">
                            <i class="bi bi-calendar3 me-1"></i><span th:text="${sc.course.semester}">Semester</span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent d-flex gap-2 pt-0 pb-3 px-3">
                        <a th:href="@{/assignments(courseId=${sc.course.id})}" class="btn btn-sm btn-outline-primary flex-grow-1">
                            <i class="bi bi-clipboard-check me-1"></i>Assignments
                        </a>
                        <a th:if="${sc.course.courseUrl}" th:href="${sc.course.courseUrl}"
                           target="_blank" class="btn btn-sm btn-outline-secondary" title="Open Course">
                            <i class="bi bi-box-arrow-up-right"></i>
                        </a>
                        <form th:action="@{/courses/delete/{id}(id=${sc.course.id})}" method="post"
                              onsubmit="return confirm('Remove this course from your list?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Available Admin Courses -->
<div class="card border-0 shadow-sm" th:if="${!adminCourses.isEmpty()}">
    <div class="card-header py-2 px-3 border-bottom">
        <i class="bi bi-globe me-2 text-info"></i>
        <strong>Available NPTEL Courses</strong>
        <span class="badge bg-info ms-2" th:text="${adminCourses.size()}">0</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Course</th>
                        <th>Code</th>
                        <th>Instructor</th>
                        <th>Duration</th>
                        <th class="pe-3">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${adminCourses}">
                        <td class="ps-3">
                            <div class="fw-semibold small" th:text="${course.courseName}">Course</div>
                            <div class="text-muted" style="font-size:0.75rem;" th:text="${course.semester}">Sem</div>
                        </td>
                        <td><span class="badge bg-light text-dark border" th:text="${course.courseCode}">CODE</span></td>
                        <td class="small" th:text="${course.instructor}">Prof.</td>
                        <td class="small" th:text="${course.duration}">12W</td>
                        <td class="pe-3">
                            <form th:action="@{/courses/enroll/{id}(id=${course.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-primary py-1">
                                    <i class="bi bi-plus-lg me-1"></i>Enroll
                                </button>
                            </form>
                            <a th:if="${course.courseUrl}" th:href="${course.courseUrl}"
                               target="_blank" class="btn btn-sm btn-outline-secondary ms-1 py-1">
                                <i class="bi bi-box-arrow-up-right"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</th:block>
</html>
</html>
