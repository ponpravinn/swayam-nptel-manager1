<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle='Notifications',
          activePage='notifications',
          content=~{::content}
      )}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
        <i class="bi bi-bell text-primary me-2"></i>Notifications
        <span th:if="${unreadCount != null and unreadCount > 0}" class="badge bg-danger ms-2" th:text="${unreadCount}">0</span>
    </h4>
    <form th:action="@{/notifications/read-all}" method="post">
        <button type="submit" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-check2-all me-1"></i>Mark All Read
        </button>
    </form>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div th:if="${notifications.isEmpty()}" class="text-center py-5 text-muted">
            <i class="bi bi-bell-slash fs-1 opacity-25"></i>
            <p class="mt-3">No notifications yet. Reminders will appear here.</p>
        </div>
        <ul th:if="${!notifications.isEmpty()}" class="list-group list-group-flush">
            <li th:each="n : ${notifications}"
                th:classappend="${!n.isRead() ? ' bg-light' : ''}"
                class="list-group-item px-4 py-3">
                <div class="d-flex align-items-start gap-3">
                    <!-- Type icon -->
                    <div class="mt-1">
                        <span th:switch="${n.type.name()}">
                            <i th:case="'ASSIGNMENT_REMINDER'" class="bi bi-clock-history text-warning fs-5"></i>
                            <i th:case="'ASSIGNMENT_OVERDUE'" class="bi bi-exclamation-triangle text-danger fs-5"></i>
                            <i th:case="'EXAM_REGISTRATION_DEADLINE'" class="bi bi-calendar-x text-orange fs-5"></i>
                            <i th:case="'EXAM_DATE_REMINDER'" class="bi bi-mortarboard text-info fs-5"></i>
                            <i th:case="'EXAM_FEE_PENDING'" class="bi bi-credit-card text-warning fs-5"></i>
                            <i th:case="*" class="bi bi-bell text-primary fs-5"></i>
                        </span>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <div class="fw-semibold small" th:text="${n.title ?: 'Notification'}">Title</div>
                            <div class="d-flex align-items-center gap-2">
                                <span th:if="${n.sentViaWhatsapp}" class="badge bg-success-subtle text-success border border-success-subtle"
                                      style="font-size:0.65rem;" title="Dispatched to Student's WhatsApp">
                                    <i class="bi bi-whatsapp me-1"></i>WhatsApp
                                </span>
                                <span th:if="${!n.isRead()}" class="badge bg-primary rounded-pill"
                                      style="font-size:0.6rem;">NEW</span>
                                <span class="text-muted" style="font-size:0.72rem;"
                                      th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Time</span>
                            </div>
                        </div>
                        <p class="mb-1 small mt-1" th:text="${n.message}">Message</p>
                        <div class="d-flex gap-2 mt-2 align-items-center flex-wrap">
                            <form th:if="${!n.isRead()}"
                                  th:action="@{/notifications/read/{id}(id=${n.id})}" method="post">
                                <button type="submit" class="btn btn-xs btn-outline-primary py-0 px-2"
                                        style="font-size:0.72rem;">Mark Read</button>
                            </form>
                            <a th:if="${n.relatedAssignmentId != null}"
                               th:href="@{/assignments}" class="btn btn-xs btn-outline-secondary py-0 px-2"
                               style="font-size:0.72rem;">View Assignment</a>
                            <a th:if="${n.relatedExaminationId != null}"
                               th:href="@{/examinations/{id}(id=${n.relatedExaminationId})}"
                               class="btn btn-xs btn-outline-secondary py-0 px-2"
                               style="font-size:0.72rem;">View Exam</a>
                            <a th:href="@{/notifications/whatsapp/{id}(id=${n.id})}" target="_blank"
                               class="btn btn-xs btn-success py-0 px-2 text-white"
                               style="font-size:0.72rem;" title="Forward / Open in WhatsApp">
                                <i class="bi bi-whatsapp me-1"></i>Open in WhatsApp
                            </a>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</div>
</th:block>
</html>
</html>
