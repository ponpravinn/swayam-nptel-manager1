<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP & Set Password - SWAYAM NPTEL Assignment Manager</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <!-- Brand -->
            <div class="text-center mb-4">
                <div class="brand-icon d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-2"
                     style="width: 56px; height: 56px;">
                    <i class="bi bi-shield-lock-fill fs-4"></i>
                </div>
                <h4 class="fw-bold text-primary mb-1">Verify OTP & Set Password</h4>
                <p class="text-muted small">SWAYAM NPTEL Assignment Manager</p>
            </div>

            <!-- Success message -->
            <div th:if="${successMsg}" class="alert alert-success py-2 px-3 small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i>
                <span th:text="${successMsg}"></span>
            </div>

            <!-- Dev/Demo OTP Notice (shows generated OTP during development) -->
            <div th:if="${devOtpNotice}" class="alert alert-info py-2 px-3 small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i>
                <strong th:text="${devOtpNotice}"></strong>
            </div>

            <!-- Error message -->
            <div th:if="${errorMsg}" class="alert alert-danger py-2 px-3 small" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <!-- Reset Password Form Card -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/auth/reset-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Account Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control"
                                       th:value="${email}" required readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="otp" class="form-label small fw-semibold">6-Digit Verification OTP *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key-fill text-primary"></i></span>
                                <input type="text" id="otp" name="otp" class="form-control font-monospace"
                                       placeholder="e.g. 583921" maxlength="6" pattern="\d{6}" required autofocus>
                            </div>
                            <div class="form-text small" style="font-size:0.75rem;">Enter the 6-digit code sent to your email.</div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label small fw-semibold">New Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" id="newPassword" name="newPassword" class="form-control"
                                       placeholder="Minimum 6 characters" required minlength="6">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label small fw-semibold">Confirm New Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                       placeholder="Re-enter new password" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-shield-check me-1"></i> Verify OTP & Update Password
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3 border-top-0">
                    <span class="small text-muted">Did not receive code?</span>
                    <a th:href="@{/auth/forgot-password}" class="small fw-semibold text-primary ms-1">Resend OTP</a>
                    <span class="mx-1 text-muted">&bull;</span>
                    <a th:href="@{/auth/login}" class="small text-muted">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
