<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SWAYAM NPTEL Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <style>
        #collegeSearchInput {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        #collegeDropdown {
            max-height: 220px;
            overflow-y: auto;
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            z-index: 1000;
        }
        .college-option {
            cursor: pointer;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
        }
        .college-option:hover, .college-option.active {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:64px;height:64px;">
                    <i class="bi bi-mortarboard-fill fs-2"></i>
                </div>
                <h4 class="fw-bold text-primary mb-0">Create Account</h4>
                <p class="text-muted small">Join SWAYAM NPTEL Assignment Manager</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMsg}"></span>
                    </div>

                    <form th:action="@{/auth/register}" method="post" th:object="${user}" onsubmit="document.getElementById('email').value = document.getElementById('email').value.trim().toLowerCase();">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Full Name *</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                   placeholder="Your Full Name" required>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="your@email.com" required
                                   oninput="this.value = this.value.toLowerCase()">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                            <div class="form-text" style="font-size:0.75rem;">You will use this email address to sign in every time.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password *</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="Min. 6 characters" required minlength="6">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3" id="collegePickerWrapper">
                            <label class="form-label small fw-semibold">Institution / College Name *</label>

                            <!-- Hidden actual field submitted with form -->
                            <input type="hidden" th:field="*{college}" id="collegeHiddenInput">

                            <!-- Search box -->
                            <div class="position-relative">
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                                    <input type="text" id="collegeSearchInput" class="form-control"
                                           placeholder="Type to search Tamil Nadu colleges..."
                                           autocomplete="off"
                                           th:value="${user.college}"
                                           oninput="filterColleges(this.value)"
                                           onfocus="showCollegeDropdown()">
                                </div>
                                <!-- Dropdown list -->
                                <div id="collegeDropdown" class="list-group position-absolute w-100 shadow d-none border">
                                    <div th:each="c : ${colleges}"
                                         class="college-option list-group-item list-group-item-action"
                                         th:text="${c}"
                                         th:attr="data-value=${c}"
                                         onclick="selectCollege(this)"></div>
                                </div>
                            </div>

                            <!-- Custom entry field (shown when "Other" is selected) -->
                            <div id="customCollegeWrapper" class="mt-2 d-none">
                                <input type="text" id="customCollegeInput" class="form-control form-control-sm"
                                       placeholder="Enter your institution / college name"
                                       maxlength="150"
                                       oninput="document.getElementById('collegeHiddenInput').value = this.value">
                            </div>

                            <div class="invalid-feedback" th:errors="*{college}"></div>
                            <div class="form-text" style="font-size:0.75rem;">
                                <i class="bi bi-geo-alt me-1 text-primary"></i>Tamil Nadu colleges listed. Select <em>"Other"</em> to type your own.
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Department / Branch *</label>
                                <input type="text" th:field="*{department}" class="form-control form-control-sm"
                                       th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'"
                                       placeholder="e.g. CSE, IT, ECE" maxlength="100" required>
                                <div class="invalid-feedback" th:errors="*{department}"></div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Roll / Register No. *</label>
                                <input type="text" th:field="*{rollNumber}" class="form-control form-control-sm"
                                       th:classappend="${#fields.hasErrors('rollNumber')} ? 'is-invalid'"
                                       placeholder="e.g. 310625243155" maxlength="50" required>
                                <div class="invalid-feedback" th:errors="*{rollNumber}"></div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Phone / WhatsApp Number *</label>
                            <input type="tel" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   placeholder="+91 9876543210" maxlength="20" required>
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                            <div class="form-text" style="font-size:0.75rem;">Used to receive automated WhatsApp reminders for assignment deadlines and exam dates.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-person-plus me-2"></i>Create Account
                        </button>
                    </form>
                    <hr class="my-3">
                    <p class="text-center small mb-0">
                        Already have an account?
                        <a th:href="@{/auth/login}" class="text-primary fw-semibold">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const dropdown      = document.getElementById('collegeDropdown');
    const searchInput   = document.getElementById('collegeSearchInput');
    const hiddenInput   = document.getElementById('collegeHiddenInput');
    const customWrapper = document.getElementById('customCollegeWrapper');
    const customInput   = document.getElementById('customCollegeInput');
    const allOptions    = Array.from(dropdown ? dropdown.querySelectorAll('.college-option') : []);

    function showCollegeDropdown() {
        if (dropdown) dropdown.classList.remove('d-none');
        filterColleges(searchInput ? searchInput.value : '');
    }

    function filterColleges(query) {
        if (!dropdown) return;
        const q = query.trim().toLowerCase();
        let anyVisible = false;
        allOptions.forEach(opt => {
            const match = opt.textContent.toLowerCase().includes(q);
            opt.style.display = match ? '' : 'none';
            if (match) anyVisible = true;
        });
        dropdown.classList.toggle('d-none', !anyVisible);
    }

    function selectCollege(el) {
        const val = el.getAttribute('data-value');
        if (searchInput) searchInput.value = val;
        if (hiddenInput) hiddenInput.value = val;
        if (dropdown) dropdown.classList.add('d-none');

        const isOther = val === 'Other (Type your institution name)';
        if (customWrapper) customWrapper.classList.toggle('d-none', !isOther);
        if (isOther) {
            if (hiddenInput) hiddenInput.value = '';
            if (customInput) customInput.focus();
        }
    }

    // Close dropdown on outside click
    document.addEventListener('click', function(e) {
        if (dropdown && searchInput && !searchInput.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.add('d-none');
            // If search box has a value not matching exactly, keep it as custom
            if (hiddenInput && !hiddenInput.value && searchInput.value.trim()) {
                hiddenInput.value = searchInput.value.trim();
            }
        }
    });

    // Pre-select on page load if college already set (validation failure case)
    window.addEventListener('DOMContentLoaded', function() {
        if (hiddenInput && hiddenInput.value && searchInput) {
            searchInput.value = hiddenInput.value;
            const isOther = hiddenInput.value === 'Other (Type your institution name)';
            if (customWrapper) customWrapper.classList.toggle('d-none', !isOther);
        }
    });

    // Validate college is filled before form submit
    document.querySelector('form').addEventListener('submit', function(e) {
        const college = hiddenInput ? hiddenInput.value.trim() : '';
        if (!college) {
            e.preventDefault();
            if (searchInput) {
                searchInput.setCustomValidity('Please select or enter your institution name.');
                searchInput.reportValidity();
            }
        } else {
            if (searchInput) searchInput.setCustomValidity('');
        }
    });
</script>
</body>
</html>
