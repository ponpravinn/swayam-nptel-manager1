<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SWAYAM NPTEL Assignment Manager</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <!-- Brand -->
            <div class="text-center mb-4">
                <div class="brand-icon d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-2"
                     style="width: 56px; height: 56px;">
                    <i class="bi bi-key-fill fs-4"></i>
                </div>
                <h4 class="fw-bold text-primary mb-1">Reset Password</h4>
                <p class="text-muted small">SWAYAM NPTEL Assignment Manager</p>
            </div>

            <!-- Error message -->
            <div th:if="${errorMsg}" class="alert alert-danger py-2 px-3 small" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <!-- Reset Form Card -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <p class="text-muted small mb-3">
                        Enter your registered email address. We will generate and send a secure 6-digit One-Time Password (OTP) to verify your identity.
                    </p>
                    <form th:action="@{/auth/forgot-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-4">
                            <label for="email" class="form-label small fw-semibold">Registered Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control"
                                       th:value="${email}" placeholder="your@email.com" required autofocus>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-send-fill me-1"></i> Send Verification OTP
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3 border-top-0">
                    <span class="small text-muted">Remember your password?</span>
                    <a th:href="@{/auth/login}" class="small fw-semibold text-primary ms-1">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
