<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SWAYAM NPTEL Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <!-- Brand -->
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:64px;height:64px;">
                    <i class="bi bi-mortarboard-fill fs-2"></i>
                </div>
                <h4 class="fw-bold text-primary mb-0">SWAYAM NPTEL</h4>
                <p class="text-muted small">Assignment Manager</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="card-title fw-bold mb-4">Sign In</h5>

                    <!-- Alerts -->
                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMsg}"></span>
                    </div>
                    <div th:if="${logoutMsg}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        <span th:text="${logoutMsg}"></span>
                    </div>
                    <div th:if="${successMsg}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        <span th:text="${successMsg}"></span>
                    </div>

                    <form th:action="@{/auth/login}" method="post" onsubmit="document.getElementById('loginEmail').value = document.getElementById('loginEmail').value.trim().toLowerCase();">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" name="email" class="form-control"
                                       placeholder="your@email.com" required autofocus
                                       oninput="this.value = this.value.toLowerCase()">
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-semibold mb-0">Password</label>
                                <a th:href="@{/auth/forgot-password}" class="small text-decoration-none text-muted">Forgot password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>

                    <hr class="my-3">
                    <p class="text-center small mb-0">
                        Don't have an account?
                        <a th:href="@{/auth/register}" class="text-primary fw-semibold">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
