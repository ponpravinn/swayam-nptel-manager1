<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle=${pageTitle},
          activePage='assignments',
          content=~{::content}
      )}">
<th:block th:fragment="content">
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header py-3 px-4 border-bottom">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-clipboard-check text-primary me-2"></i>
                    <span th:text="${pageTitle}">Add Assignment</span>
                </h5>
            </div>
            <div class="card-body p-4">
                <form th:action="${assignment.id != null} ? @{/assignments/edit/{id}(id=${assignment.id})} : @{/assignments/add}"
                      method="post" th:object="${assignment}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Course select (as hidden input when editing, select when adding) -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Course *</label>
                        <select name="courseId" class="form-select" required>
                            <option value="">Select Course...</option>
                            <option th:each="sc : ${courses}"
                                    th:value="${sc.course.id}"
                                    th:selected="${assignment.course != null and assignment.course.id == sc.course.id}"
                                    th:text="${sc.course.courseName}">Course</option>
                        </select>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">Assignment Title *</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   placeholder="e.g., Week 3 Assignment - Collections" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Assignment No. *</label>
                            <input type="number" th:field="*{assignmentNumber}" class="form-control"
                                   placeholder="3" required min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Due Date & Time *</label>
                            <input type="datetime-local" th:field="*{dueDate}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Release Date</label>
                            <input type="date" th:field="*{releaseDate}" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Submission URL</label>
                            <input type="url" th:field="*{submissionUrl}" class="form-control"
                                   placeholder="https://onlinecourses.nptel.ac.in/...">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"
                                      placeholder="Topics covered in this assignment..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>
                            <span th:text="${assignment.id != null ? 'Update Assignment' : 'Add Assignment'}">Save</span>
                        </button>
                        <a th:href="@{/assignments}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</th:block>
</html>
</html>
