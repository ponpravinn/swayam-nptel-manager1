<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | NPTEL Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="text-danger mb-3"><i class="bi bi-exclamation-triangle-fill" style="font-size:4rem;"></i></div>
            <h3 class="fw-bold" th:text="${errorTitle ?: '500 - Internal Server Error'}">500 - Internal Server Error</h3>
            <p class="text-muted" th:text="${errorMessage ?: 'An unexpected server error occurred. Please try again later.'}">Message</p>
            <a th:href="@{/dashboard}" class="btn btn-primary mt-3">
                <i class="bi bi-house me-2"></i>Home / Dashboard
            </a>
            <a th:href="@{/auth/login}" class="btn btn-outline-primary mt-3 ms-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary mt-3 ms-2">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
        </div>
    </div>
</div>
</body>
</html>
