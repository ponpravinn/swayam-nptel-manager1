<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle='Admin - Course',
          activePage='admin',
          content=~{::content}
      )}">
<th:block th:fragment="content">
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header py-3 px-4 border-bottom">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-shield-check text-primary me-2"></i>
                    <span th:text="${course.id != null ? 'Edit Course' : 'Add Course (Admin)'}">Course</span>
                </h5>
            </div>
            <div class="card-body p-4">
                <form th:action="${course.id != null} ? @{/admin/courses/edit/{id}(id=${course.id})} : @{/admin/courses/add}"
                      method="post" th:object="${course}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Course Name *</label>
                            <input type="text" th:field="*{courseName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Course Code *</label>
                            <input type="text" th:field="*{courseCode}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Instructor</label>
                            <input type="text" th:field="*{instructor}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Duration</label>
                            <input type="text" th:field="*{duration}" class="form-control" placeholder="12 Weeks">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Semester</label>
                            <input type="text" th:field="*{semester}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Start Date</label>
                            <input type="date" th:field="*{startDate}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">End Date</label>
                            <input type="date" th:field="*{endDate}" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Course URL</label>
                            <input type="url" th:field="*{courseUrl}" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Publish Course
                        </button>
                        <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</th:block>
</html>
</html>
