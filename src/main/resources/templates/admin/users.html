<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle='User Management',
          activePage='admin',
          content=~{::content}
      )}">
<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-people text-primary me-2"></i>User Management</h4>
    <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to Admin
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="px-4">Name</th>
                        <th>Email</th>
                        <th>College</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Notifications</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="px-4">
                            <div class="d-flex align-items-center gap-2">
                                <div class="avatar-circle bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                                     style="width:34px;height:34px;font-size:0.85rem;flex-shrink:0;">
                                    <span th:text="${#strings.substring(u.fullName,0,1).toUpperCase()}">U</span>
                                </div>
                                <div>
                                    <div class="fw-semibold small" th:text="${u.fullName}">Name</div>
                                    <div class="d-flex align-items-center gap-1 mt-1">
                                        <span class="text-muted" style="font-size:0.72rem;" th:text="${u.phone ?: '-'}"></span>
                                        <a th:if="${u.phone != null and !u.phone.isBlank()}"
                                           th:href="'https://wa.me/' + ${#strings.replace(u.phone, ' ', '').replace('+', '').replace('-', '')} + '?text=Hello%20' + ${u.fullName} + '%2C%20this%20is%20a%20reminder%20from%20SWAYAM%20NPTEL%20Manager%20regarding%20your%20course%20deadlines.'"
                                           target="_blank"
                                           class="badge bg-success text-white text-decoration-none px-1"
                                           style="font-size:0.65rem;"
                                           title="Chat with Student on WhatsApp">
                                            <i class="bi bi-whatsapp"></i> Chat
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="small" th:text="${u.email}">email</td>
                        <td class="small" th:text="${u.college ?: '-'}">college</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                  th:text="${u.role.name()}">STUDENT</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.enabled} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${u.enabled} ? 'Active' : 'Disabled'">Active</span>
                        </td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <span class="badge"
                                      th:classappend="${u.emailNotificationsEnabled} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${u.emailNotificationsEnabled} ? 'Email: ON' : 'Email: OFF'">On</span>
                                <span class="badge"
                                      th:classappend="${u.whatsappNotificationsEnabled} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${u.whatsappNotificationsEnabled} ? 'WhatsApp: ON' : 'WhatsApp: OFF'">On</span>
                            </div>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/admin/users/toggle/{id}(id=${u.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${u.enabled} ? 'btn-outline-warning' : 'btn-outline-success'"
                                        th:title="${u.enabled} ? 'Disable Account' : 'Enable Account'">
                                    <i class="bi" th:classappend="${u.enabled} ? 'bi-person-x' : 'bi-person-check'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-people fs-3 d-block mb-2 opacity-50"></i>
                            No users found
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer text-muted small px-4 py-2">
        Total: <strong th:text="${users.size()}">0</strong> users
    </div>
</div>

</th:block>
</html>
</html>
