<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle='Admin - Examinations',
          activePage='admin',
          content=~{::content}
      )}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-journal-check text-primary me-2"></i>Manage Examinations</h4>
    <a th:href="@{/admin/examinations/add}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Add Examination
    </a>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div th:if="${examinations.isEmpty()}" class="text-center py-5 text-muted">
            No examination information published yet.
        </div>
        <div class="table-responsive" th:if="${!examinations.isEmpty()}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Course</th>
                        <th>Session</th>
                        <th>Reg Closes</th>
                        <th>Exam Date</th>
                        <th>Fee</th>
                        <th class="pe-3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exam : ${examinations}">
                        <td class="ps-3 small fw-semibold" th:text="${exam.course.courseName}">Course</td>
                        <td class="small" th:text="${exam.examSession}">Session</td>
                        <td class="small" th:text="${exam.registrationCloseDate != null ? #temporals.format(exam.registrationCloseDate, 'dd MMM yyyy') : '-'}">-</td>
                        <td class="small" th:text="${exam.examDate != null ? #temporals.format(exam.examDate, 'dd MMM yyyy') : '-'}">-</td>
                        <td class="small" th:text="${exam.registrationFee != null ? 'â‚¹' + exam.registrationFee : '-'}">-</td>
                        <td class="pe-3">
                            <a th:href="@{/admin/examinations/edit/{id}(id=${exam.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/examinations/delete/{id}(id=${exam.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Delete this examination record?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</th:block>
</html>
</html>
