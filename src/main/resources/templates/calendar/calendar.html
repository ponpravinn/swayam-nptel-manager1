<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle='Calendar',
          activePage='calendar',
          content=~{::content}
      )}">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">

<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-calendar3 text-primary me-2"></i>Academic Calendar</h4>
</div>

<!-- Legend -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2 px-3">
        <div class="d-flex flex-wrap gap-3 small">
            <div class="d-flex align-items-center gap-2">
                <span class="badge" style="background:#6c757d;">&#9632;</span> Not Started
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge" style="background:#ffc107; color:#000;">&#9632;</span> In Progress
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge" style="background:#28a745;">&#9632;</span> Completed
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge" style="background:#dc3545;">&#9632;</span> Overdue / Exam
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge" style="background:#17a2b8;">&#9632;</span> Reg Opens
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge" style="background:#fd7e14;">&#9632;</span> Reg Closes
            </div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-3">
        <div id="calendar"></div>
<script th:inline="javascript">
/*<![CDATA[*/
document.addEventListener('DOMContentLoaded', function () {
    const eventsJson = /*[[${eventsJson}]]*/ '[]';
    const events = JSON.parse(eventsJson);

    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        events: events,
        eventClick: function(info) {
            if (info.event.url) {
                info.jsEvent.preventDefault();
                window.location.href = info.event.url;
            }
        },
        height: 'auto',
        aspectRatio: 1.8
    });
    calendar.render();
});
/*]]>*/
</script>
</th:block>
</html>
