# =============================================
# SWAYAM NPTEL Assignment Manager - H2 Default
# =============================================
spring.application.name=SWAYAM NPTEL Assignment Manager

# ---- Server ----
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# ---- H2 In-Memory Database (default profile) ----
spring.datasource.url=jdbc:h2:file:./data/npteldb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- Email (configure to enable email notifications) ----
spring.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:YOUR_EMAIL@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- App custom settings ----
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.admin.email=${APP_ADMIN_EMAIL:admin@nptelmanager.com}
app.notification.reminder-days=7,3,1,0
app.notification.exam-reminder-days=7,3,1,0

# ---- WhatsApp Notifications ----
app.whatsapp.enabled=${WHATSAPP_ENABLED:true}
# Provider mode: 'auto' (detects available config or provides click-to-chat + log simulation), 'twilio', 'callmebot', 'mock'
app.whatsapp.provider=${WHATSAPP_PROVIDER:auto}
# CallMeBot Free WhatsApp API (https://www.callmebot.com/blog/free-api-whatsapp-messages/)
app.whatsapp.callmebot.api-key=${WHATSAPP_CALLMEBOT_KEY:}
# Twilio WhatsApp Business API (Optional)
app.whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.whatsapp.twilio.from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# ---- File upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
